<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gold & Ruby Silk Flow Field</title>
  <!-- Load p5.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #080305;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script>
    let particles = [];
    const numParticles = 2500; // Increased density so it's always full
    const noiseScale = 0.004;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      background(8, 3, 5);
      
      // Initialize dense silk threads
      for (let i = 0; i < numParticles; i++) {
        particles.push(createNewParticle(true));
      }
    }

    function draw() {
      // Soft background fade to maintain a glowing silk trail without muddying
      background(8, 3, 5, 15);

      let mousePos = createVector(mouseX, mouseY);

      for (let i = 0; i < particles.length; i++) {
        let p = particles[i];

        // Store previous position to draw smooth continuous silk lines
        p.prevX = p.pos.x;
        p.prevY = p.pos.y;

        // Perlin noise flow field motion
        let n = noise(p.pos.x * noiseScale, p.pos.y * noiseScale, frameCount * 0.0015);
        let angle = n * TWO_PI * 2.5;
        let dir = p5.Vector.fromAngle(angle);
        dir.mult(p.speed);

        // Cursor interaction (magnetic whirlpool / shockwave)
        let d = p5.Vector.dist(p.pos, mousePos);
        if (d < 250 && d > 2) {
          let mouseForce = p5.Vector.sub(mousePos, p.pos);
          mouseForce.normalize();
          let swirl = createVector(-mouseForce.y, mouseForce.x);
          
          if (mouseIsPressed) {
            // Click to blast particles outward
            dir.sub(mouseForce.mult(5.0));
          } else {
            // Hover to pull into a smooth silk vortex
            dir.add(swirl.mult(3.0));
            dir.add(mouseForce.mult(0.9));
          }
        }

        // Update position
        p.pos.add(dir);

        // Draw silky smooth connected lines
        stroke(p.r, p.g, p.b, p.alpha);
        strokeWeight(p.weight);
        line(p.prevX, p.prevY, p.pos.x, p.pos.y);

        // If particle goes off-screen, instantly respawn it so density never drops
        if (p.pos.x < 0 || p.pos.x > width || p.pos.y < 0 || p.pos.y > height) {
          particles[i] = createNewParticle(false);
        }
      }
    }

    function createNewParticle(randomPos) {
      let x = randomPos ? random(width) : random(width);
      let y = randomPos ? random(height) : random(height);
      
      // Blend of Rich Gold, Amber, and Ruby Red colors
      let isGold = random(1) > 0.4;
      let r, g, b;
      
      if (isGold) {
        // Glowing Gold / Amber
        r = random(220, 255);
        g = random(160, 210);
        b = random(30, 80);
      } else {
        // Deep Ruby Red
        r = random(180, 230);
        g = random(10, 45);
        b = random(40, 90);
      }

      return {
        pos: createVector(x, y),
        prevX: x,
        prevY: y,
        speed: random(1.2, 2.5),
        r: r,
        g: g,
        b: b,
        alpha: random(120, 220),
        weight: random(1.0, 2.2)
      };
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
